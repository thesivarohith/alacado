<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Portfolio – Cylinder Effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }

  /* Screen Border Frame */
  .screen-frame {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-left: 16px solid #fff;
    border-right: 16px solid #fff;
    border-bottom: 16px solid #fff;
    border-top: 50px solid #fff;
    border-radius: 32px;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .screen-frame.visible {
    opacity: 1;
  }

  /* Dipping Tab Notch */
  .logo-tab {
    position: fixed;
    top: 50px; /* aligns exactly with bottom of border-top */
    left: 50%;
    transform: translateX(-50%) translateY(-100%); /* start tucked up */
    width: 240px;
    height: 54px;
    background: #fff;
    border-radius: 0 0 28px 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 101;
    opacity: 0;
    transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 1s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .logo-tab.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0); /* slide down */
  }

  /* Concave smooth corners for the dipping notch */
  .logo-tab::before {
    content: "";
    position: absolute;
    top: 0;
    left: -24px;
    width: 24px;
    height: 24px;
    background: transparent;
    border-top-right-radius: 24px;
    box-shadow: 12px -12px 0 0 #fff;
  }
  .logo-tab::after {
    content: "";
    position: absolute;
    top: 0;
    right: -24px;
    width: 24px;
    height: 24px;
    background: transparent;
    border-top-left-radius: 24px;
    box-shadow: -12px -12px 0 0 #fff;
  }

  /* Premium Rose-Gold ALACADO Logo */
  .alacado-logo {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.35em;
    background: linear-gradient(90deg, #b88762 0%, #f3d1be 30%, #e3ba9a 50%, #f3d1be 70%, #b88762 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
    padding-left: 0.35em; /* balance letter-spacing offset */
    line-height: 1;
  }

  /* Editorial Home Page Container */
  #homePage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 10%;
    z-index: 10;
    background: #000915; /* luxurious dark navy/black */
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1);
  }
  #homePage.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .hero-container {
    max-width: 800px;
    margin-top: 50px;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-weight: 300;
    line-height: 1.25;
    color: rgba(255, 255, 255, 0.95);
    letter-spacing: -0.015em;
  }
  .hero-title span.italic-serif {
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    color: #f3d1be;
  }
  .hero-title span.gradient-text {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    background: linear-gradient(90deg, #c58e72 0%, #f3d1be 50%, #c58e72 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.02em;
  }
  .hero-subtext {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 30px;
    display: block;
  }

  .hint {
    position: fixed;
    bottom: 28px;
    right: 32px;
    z-index: 10;
    font-family: 'DM Sans', sans-serif;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: fadeIn 2s ease 1s forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<div class="screen-frame"></div>
<div class="logo-tab">
  <div class="alacado-logo">ΛLΛCΛDO</div>
</div>

<div id="homePage">
  <div class="hero-container">
    <h1 class="hero-title">
      Tell us <span class="italic-serif">what</span> you need.<br>
      We connect <span class="italic-serif">you</span> with the <span class="gradient-text">right people</span>.
    </h1>
    <span class="hero-subtext">Creative Network — ALACADO</span>
  </div>
</div>

<div class="hint">scroll to explore</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const images = [
  {
    url: "https://res.cloudinary.com/darbjeyc2/image/upload/v1780114603/Minimalist_food_element_microgreens_202605291935_logy2o.jpg",
    label: "ZUVAI — RESTAURANT MENU"
  },
  {
    url: "https://res.cloudinary.com/darbjeyc2/image/upload/v1780114591/Data_pillar_surging_upward_abstract_202605291935_izlluv.jpg",
    label: "FOCUSFLOW — AI LEARNING"
  },
  {
    url: "https://res.cloudinary.com/darbjeyc2/image/upload/v1780114589/Brutalist_monolith_with_UI_elements_202605291935_tycftf.jpg",
    label: "CHATOVIBE — REAL TIME CHAT"
  }
];

// Scene setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 0.01); // inside the cylinder

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Build cylinder — inside face
// radius=5, height per image = 6, open ended
const RADIUS = 5;
const IMG_HEIGHT = 8.5;
const TOTAL_HEIGHT = IMG_HEIGHT * images.length;

// Load all textures and create segments
const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

// Build 3 COPIES of the images (top copy, middle copy, bottom copy)
// Camera lives in the middle copy. When it reaches edge of middle, 
// we silently teleport it back — seamless infinite loop.
const COPIES = 3;
const textures = []; // store loaded textures for reuse

// First load all textures, then build all segments
let loadedCount = 0;
images.forEach((img, i) => {
  loader.load(img.url, (texture) => {
    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    textures[i] = texture;
    loadedCount++;
    if (loadedCount === images.length) buildCylinder();
  });
});

function buildCylinder() {
  // Total segments = images.length * COPIES
  // We place them from top (+) to bottom (-)
  const totalSegs = images.length * COPIES;
  for (let copy = 0; copy < COPIES; copy++) {
    for (let i = 0; i < images.length; i++) {
      const geo = new THREE.CylinderGeometry(RADIUS, RADIUS, IMG_HEIGHT, 80, 1, true);
      const mat = new THREE.MeshBasicMaterial({ map: textures[i], side: THREE.BackSide });
      const mesh = new THREE.Mesh(geo, mat);
      // Global index in the full stack
      const globalIdx = copy * images.length + i;
      mesh.position.y = (totalSegs / 2 - 0.5 - globalIdx) * IMG_HEIGHT;
      mesh.rotation.y = -Math.PI / 2; // Center the image texture with the camera's view
      scene.add(mesh);
    }
  }
}

// Camera starts at center of MIDDLE copy
// Middle copy starts at index: images.length (after first copy)
// Center of middle copy = average y of its segments
const middleStartIdx = images.length; // first segment of middle copy
const totalSegs = images.length * COPIES;
// Y of first segment of middle copy
const middleTopY = (totalSegs / 2 - 0.5 - middleStartIdx) * IMG_HEIGHT;
// Y of last segment of middle copy
const middleBottomY = (totalSegs / 2 - 0.5 - (middleStartIdx + images.length - 1)) * IMG_HEIGHT;

let currentY = middleTopY;
let targetY = currentY;
camera.position.y = currentY;
camera.lookAt(RADIUS, currentY, 0);

// scrollY: freely increasing/decreasing, no clamp
let scrollY = 0;
let cumulativeScroll = 0; // Tracks absolute forward progress to avoid teleport reset
const SCROLL_SPEED = 0.008;

let autoScrollActive = true;
const AUTO_SCROLL_SPEED = 0.035; // smooth slow vertical downward spin
const TARGET_REVOLUTIONS = 2;
const REVOLUTION_DISTANCE = images.length * IMG_HEIGHT; // 3 * 8.5 = 25.5
const MAX_SCROLL = TARGET_REVOLUTIONS * REVOLUTION_DISTANCE; // 51.0
let transitionTriggered = false;

window.addEventListener('wheel', (e) => {
  if (transitionTriggered) return;
  const delta = e.deltaY * SCROLL_SPEED;
  scrollY += delta;
  if (scrollY < 0) scrollY = 0;
  if (delta > 0) {
    cumulativeScroll += delta;
  }
});

let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  if (transitionTriggered) return;
  touchStartY = e.touches[0].clientY;
});
window.addEventListener('touchmove', (e) => {
  if (transitionTriggered) return;
  const dy = touchStartY - e.touches[0].clientY;
  touchStartY = e.touches[0].clientY;
  const delta = dy * SCROLL_SPEED * 0.5;
  scrollY += delta;
  if (scrollY < 0) scrollY = 0;
  if (delta > 0) {
    cumulativeScroll += delta;
  }
});

function triggerZoomAndTransition() {
  if (transitionTriggered) return;
  transitionTriggered = true;
  autoScrollActive = false;

  // Start fast fade-out of WebGL canvas
  renderer.domElement.style.transition = 'opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
  renderer.domElement.style.opacity = '0';

  // Smoothly display frame and home page
  const screenFrame = document.querySelector('.screen-frame');
  const logoTab = document.querySelector('.logo-tab');
  const homePage = document.getElementById('homePage');

  screenFrame.classList.add('visible');
  logoTab.classList.add('visible');
  homePage.classList.add('visible');
}

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  if (!transitionTriggered) {
    if (autoScrollActive) {
      scrollY += AUTO_SCROLL_SPEED;
      cumulativeScroll += AUTO_SCROLL_SPEED;
    }
    
    // Clamp to exactly 2 revolutions based on cumulative progress
    if (cumulativeScroll >= MAX_SCROLL) {
      cumulativeScroll = MAX_SCROLL;
      triggerZoomAndTransition();
    }

    targetY = middleTopY - scrollY;
    currentY += (targetY - currentY) * 0.07;

    // Seamless teleport: if camera drifts out of middle copy range into
    // top or bottom copy, shift scrollY by exactly one full set of images
    // so camera snaps back into middle — invisible because geometry repeats
    const oneSet = images.length * IMG_HEIGHT;
    if (currentY < middleBottomY - IMG_HEIGHT) {
      scrollY -= oneSet;
      currentY += oneSet;
      targetY += oneSet;
    } else if (currentY > middleTopY + IMG_HEIGHT) {
      scrollY += oneSet;
      currentY -= oneSet;
      targetY -= oneSet;
    }
  } else {
    // Zoom-in effect: move camera closer to the active centered image
    camera.position.x += (4.6 - camera.position.x) * 0.08;
  }

  camera.position.y = currentY;
  camera.lookAt(RADIUS, currentY, camera.position.z);
  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
