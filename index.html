<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ALACADO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    min-height: 300vh; /* Scroller spacer for both Scene 1 (100vh) and Scene 2 (100vh) */
    overflow-x: hidden;
  }

  /* Viewport-locked, full-screen container */
  .parallax-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    will-change: opacity, transform, visibility;
  }

  #background-container {
    z-index: 1;
    background-color: #000000;
  }

  #parallax-scene {
    z-index: 10;
    background-color: transparent;
    opacity: 1;
    visibility: visible;
  }

  #scene-2 {
    z-index: 11;
    background-color: transparent;
    opacity: 0;
    visibility: hidden;
  }

  /* Layer centering and cover positioning */
  .layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    will-change: transform, opacity;
  }

  /* Layer 1: Background Void */
  .layer-bg {
    z-index: 1;
  }

  /* Layer 2: Foreground Pillars with blend mode */
  .layer-fg {
    z-index: 2;
    mix-blend-mode: screen; /* Solid black center becomes transparent */
    filter: sepia(0.6) saturate(1.4) hue-rotate(-5deg) brightness(0.95);
  }

  /* Layer 3: Centerpiece Monolith Logo */
  .layer-center {
    z-index: 3;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 60vw;
    max-height: 60vh;
    object-fit: contain;
  }

  /* --- Scene 2 Elements --- */
  
  /* Glowing Diamond Centerpiece */
  .layer-diamond {
    z-index: 2; /* Vortex (1) -> Diamond (2) -> Rock Shell Halves (3) */
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 50vw;
    max-height: 50vh;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.8);
    mix-blend-mode: screen; /* Removes black rectangular box, showing background void underneath */
    filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.45));
    will-change: transform, opacity;
  }

  /* Rock shell halves layered directly on top of the diamond */
  .shell-half {
    z-index: 3; /* Vortex (1) -> Diamond (2) -> Rock Shell Halves (3) */
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 50vw;
    max-height: 50vh;
    object-fit: contain;
    will-change: transform;
  }

  .shell-left {
    clip-path: inset(0 50% 0 0);
  }

  .shell-right {
    clip-path: inset(0 0 0 50%);
  }
</style>
</head>
<body>

  <!-- Shared Persistent Background Void -->
  <div class="parallax-container" id="background-container">
    <img src="Background Void.jpeg" class="layer layer-bg" id="layer-bg" alt="Background Void"/>
  </div>

  <!-- Full-screen Scene 1: The Entry -->
  <div class="parallax-container" id="parallax-scene">
    <img src="foreground.jpeg" class="layer layer-fg" id="layer-fg" alt="Foreground Pillars"/>
    <img src="Centerpiece.png" class="layer layer-center" id="layer-center" alt="Centerpiece"/>
  </div>

  <!-- Full-screen Scene 2: The Hidden Gem -->
  <div class="parallax-container" id="scene-2">
    <img src="diamond.jpeg" class="layer-diamond" id="diamond-core" alt="Diamond Core"/>
    <img src="diamond-shell.png" class="shell-half shell-left" id="shell-left" alt="Shell Left"/>
    <img src="diamond-shell.png" class="shell-half shell-right" id="shell-right" alt="Shell Right"/>
  </div>

  <!-- Scroll Spacer: Enables 200vh total scroll distance -->
  <div style="height: 300vh;"></div>

  <!-- GSAP CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Master timeline mapped to 200vh total scroll range
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "body",
        start: "top top",
        end: () => "+=" + (window.innerHeight * 2), // Scroll height of exactly two viewports
        scrub: true,
        invalidateOnRefresh: true
      }
    });

    // --- CONTINUOUS BACKGROUND SCALING (Timeline 0.0 to 2.0) ---
    // Background Void slowly continuously scales up throughout Scene 1 and Scene 2
    tl.to("#layer-bg", {
      scale: 1.3,
      ease: "none",
      duration: 2.0
    }, 0);

    // --- SCENE 1 ANIMATIONS (Timeline 0.0 to 1.0) ---
    tl.to("#layer-fg", {
      scale: 1.4,
      ease: "power1.in",
      duration: 1.0
    }, 0);

    tl.to("#layer-center", {
      scale: 2.5,
      opacity: 0,
      ease: "power1.out",
      duration: 1.0
    }, 0);

    // --- CROSSFADE SEQUENCE (Timeline 0.95 to 1.05) ---
    // Scene 1 elements fade out, Scene 2 elements fade in (Vortex background persists)
    tl.to("#parallax-scene", {
      autoAlpha: 0,
      ease: "power1.inOut",
      duration: 0.1
    }, 0.95);

    tl.to("#scene-2", {
      autoAlpha: 1,
      ease: "power1.inOut",
      duration: 0.1
    }, 0.95);

    // --- SCENE 2 ANIMATIONS (Timeline 1.0 to 1.8) ---
    // Shell left half slides left
    tl.to("#shell-left", {
      x: "-30vw",
      ease: "power2.inOut",
      duration: 0.8
    }, 1.0);

    // Shell right half slides right
    tl.to("#shell-right", {
      x: "30vw",
      ease: "power2.inOut",
      duration: 0.8
    }, 1.0);

    // Diamond reveals and zooms slightly
    tl.to("#diamond-core", {
      opacity: 1,
      scale: 1.3,
      ease: "power2.inOut",
      duration: 0.8
    }, 1.0);

    // --- SCENE 2 EXIT ANIMATIONS (Timeline 1.8 to 2.0) ---
    // Diamond zooms in past the viewport borders
    tl.to("#diamond-core", {
      scale: 8.0,
      ease: "power2.in",
      duration: 0.2
    }, 1.8);

    // Scene 2 container fades to visibility hidden
    tl.to("#scene-2", {
      autoAlpha: 0,
      ease: "power2.inOut",
      duration: 0.2
    }, 1.8);

    // Shared background container fades to visibility hidden to leave pure black behind
    tl.to("#background-container", {
      autoAlpha: 0,
      ease: "power2.inOut",
      duration: 0.2
    }, 1.8);
  </script>
</body>
</html>
