<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ALACADO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    min-height: 400vh; /* Extended scroller spacer for slower, more cinematic scroll-time */
    overflow-x: hidden;
  }

  /* Viewport-locked, full-screen container */
  .parallax-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    will-change: opacity, transform, visibility;
  }

  #background-container {
    z-index: 1;
    background-color: #000000;
  }

  #foreground-container {
    z-index: 2;
    background-color: transparent;
  }

  #parallax-scene {
    z-index: 10;
    background-color: transparent;
    opacity: 1;
    visibility: visible;
  }

  #scene-2 {
    z-index: 11;
    background-color: transparent;
    opacity: 0;
    visibility: hidden;
  }

  /* Layer centering and cover positioning */
  .layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    will-change: transform, opacity;
  }

  /* Layer 1: Background Void */
  .layer-bg {
    z-index: 1;
  }

  /* Layer 2: Foreground Pillars with blend mode */
  .layer-fg {
    z-index: 2;
    mix-blend-mode: screen; /* Solid black center becomes transparent */
    filter: sepia(0.6) saturate(1.4) hue-rotate(-5deg) brightness(0.95);
  }

  /* Layer 3: Centerpiece Monolith Logo */
  .layer-center {
    z-index: 3;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 60vw;
    max-height: 60vh;
    object-fit: contain;
  }

  /* --- Scene 2 Elements --- */
  
  /* Glowing Diamond Centerpiece */
  .layer-diamond {
    z-index: 2; /* Vortex (1) -> Diamond (2) -> Rock Shell Halves (3) */
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 50vw;
    max-height: 50vh;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.8);
    mix-blend-mode: screen; /* Removes black rectangular box, showing background void underneath */
    filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.45));
    will-change: transform, opacity;
  }

  /* Rock shell halves layered directly on top of the diamond */
  .shell-half {
    z-index: 3; /* Vortex (1) -> Diamond (2) -> Rock Shell Halves (3) */
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 50vw;
    max-height: 50vh;
    object-fit: contain;
    will-change: transform;
    mix-blend-mode: normal !important; /* Force normal blend mode, prevent inheriting transparent blend mode */
    opacity: 1 !important; /* Force full solid opacity */
  }

  .shell-left {
    clip-path: inset(0 50% 0 0);
  }

  .shell-right {
    clip-path: inset(0 0 0 50%);
  }
</style>
</head>
<body>

  <!-- Shared Persistent Background Void -->
  <div class="parallax-container" id="background-container">
    <img src="Background Void.jpeg" class="layer layer-bg" id="layer-bg" alt="Background Void"/>
  </div>

  <!-- Shared Persistent Foreground Pillars -->
  <div class="parallax-container" id="foreground-container">
    <img src="foreground.jpeg" class="layer layer-fg" id="layer-fg" alt="Foreground Pillars"/>
  </div>

  <!-- Full-screen Scene 1: The Entry Centerpiece -->
  <div class="parallax-container" id="parallax-scene">
    <img src="Centerpiece.png" class="layer layer-center" id="layer-center" alt="Centerpiece"/>
  </div>

  <!-- Full-screen Scene 2: The Hidden Gem -->
  <div class="parallax-container" id="scene-2">
    <img src="diamond.png" class="layer-diamond" id="diamond-core" alt="Diamond Core"/>
    <img src="splitrock-Photoroom.png" class="shell-half shell-left" id="shell-left" alt="Shell Left"/>
    <img src="splitrock-Photoroom.png" class="shell-half shell-right" id="shell-right" alt="Shell Right"/>
  </div>

  <!-- Scroll Spacer: Enables 300vh total scroll distance -->
  <div style="height: 400vh;"></div>

  <!-- GSAP CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Master timeline mapped to 300vh total scroll range (body height 400vh minus viewport height 100vh)
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "body",
        start: "top top",
        end: () => "+=" + (window.innerHeight * 3), // Scroll height of exactly three viewports
        scrub: true,
        invalidateOnRefresh: true
      }
    });

    // --- CONTINUOUS PERSISTENT BACKGROUND SCALING (Timeline 0.0 to 3.0) ---
    // Background Void slowly continuously scales up throughout both scenes to maximize visual depth
    tl.to("#layer-bg", {
      scale: 1.35,
      ease: "none",
      duration: 3.0
    }, 0);

    // --- SCENE 1 ANIMATIONS (Timeline 0.0 to 1.5) ---
    // Foreground Pillars scale up rapidly from 1.0 to 1.4 during Scene 1 (flying out of frame)
    tl.to("#layer-fg", {
      scale: 1.4,
      ease: "power1.in",
      duration: 1.5
    }, 0);

    // Monolith Centerpiece zooms in and fades out during the first scene
    tl.to("#layer-center", {
      scale: 2.5,
      opacity: 0,
      ease: "power1.out",
      duration: 1.5
    }, 0);

    // --- CROSSFADE SEQUENCE (Timeline 1.45 to 1.55) ---
    // Scene 1 logo centerpiece and foreground pillars container fade out, Scene 2 gem elements fade in
    // Persistent background void remains fully active
    tl.to("#parallax-scene", {
      autoAlpha: 0,
      ease: "power1.inOut",
      duration: 0.1
    }, 1.45);

    tl.to("#foreground-container", {
      autoAlpha: 0,
      ease: "power1.inOut",
      duration: 0.1
    }, 1.45);

    tl.to("#scene-2", {
      autoAlpha: 1,
      ease: "power1.inOut",
      duration: 0.1
    }, 1.45);

    // --- SCENE 2 ANIMATIONS (Timeline 1.5 to 2.6) ---
    // Left shell (splitrock-Photoroom.png) starts offset right (+20px) to close splitrock gap, then slides left
    tl.fromTo("#shell-left", {
      x: "20px"
    }, {
      x: "-40vw",
      ease: "power2.inOut",
      duration: 1.1
    }, 1.5);

    // Right shell starts offset left (-20px) to close splitrock gap, then slides right
    tl.fromTo("#shell-right", {
      x: "-20px"
    }, {
      x: "40vw",
      ease: "power2.inOut",
      duration: 1.1
    }, 1.5);

    // Diamond reveals and zooms slightly inside the active background void
    tl.to("#diamond-core", {
      opacity: 1,
      scale: 1.3,
      ease: "power2.inOut",
      duration: 1.1
    }, 1.5);

    // --- MASTER EXIT ANIMATIONS (Timeline 2.6 to 3.0) ---
    // Diamond zooms in past the viewport borders
    tl.to("#diamond-core", {
      scale: 8.0,
      ease: "power2.in",
      duration: 0.4
    }, 2.6);

    // Fade out Scene 2 container
    tl.to("#scene-2", {
      autoAlpha: 0,
      ease: "power2.inOut",
      duration: 0.4
    }, 2.6);

    // Fade out persistent background container to complete transition to black
    tl.to("#background-container", {
      autoAlpha: 0,
      ease: "power2.inOut",
      duration: 0.4
    }, 2.6);
  </script>
</body>
</html>
