<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ALACADO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    min-height: 200vh;
    overflow-x: hidden;
  }

  /* Viewport-locked, full-screen container */
  .parallax-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 10;
    background-color: #000000;
    opacity: 1;
    transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), visibility 1.2s;
    will-change: opacity, visibility;
  }
  
  .parallax-container.fade-out {
    opacity: 0;
    visibility: hidden;
  }

  /* Layer centering and cover positioning */
  .layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    will-change: transform, opacity;
  }

  /* Layer 1: Background Void */
  .layer-bg {
    z-index: 1;
  }

  /* Layer 2: Foreground Pillars with blend mode */
  .layer-fg {
    z-index: 2;
    mix-blend-mode: screen; /* Solid black center becomes transparent */
  }

  /* Layer 3: Centerpiece Monolith Logo */
  .layer-center {
    z-index: 3;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: auto;
    height: auto;
    max-width: 60vw;
    max-height: 60vh;
    object-fit: contain;
  }
</style>
</head>
<body>

  <!-- Full-screen Parallax Scene -->
  <div class="parallax-container" id="parallax-scene">
    <img src="Background Void.jpeg" class="layer layer-bg" id="layer-bg" alt="Background Void"/>
    <img src="foreground.jpeg" class="layer layer-fg" id="layer-fg" alt="Foreground Pillars"/>
    <img src="Centerpiece.png" class="layer layer-center" id="layer-center" alt="Centerpiece"/>
  </div>

  <!-- Scroll Spacer: 100% viewport scroll triggers exit -->
  <div style="height: 200vh;"></div>

  <!-- GSAP CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Timeline for scroll-linked layered parallax translations
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "body",
        start: "top top",
        end: () => "+=" + window.innerHeight, // Map scroll up to 100% of viewport height
        scrub: true,
        invalidateOnRefresh: true
      }
    });

    // 1. Background Void: Slowly scale UP from 1.0 to 1.15
    tl.to("#layer-bg", {
      scale: 1.15,
      ease: "none"
    }, 0);

    // 2. Foreground Pillars: Scale UP rapidly from 1.0 to 1.4
    tl.to("#layer-fg", {
      scale: 1.4,
      ease: "power1.in"
    }, 0);

    // 3. Centerpiece: Scale UP smoothly from 1.0 to 2.5 and fade opacity from 1 to 0
    tl.to("#layer-center", {
      scale: 2.5,
      opacity: 0,
      ease: "power1.out"
    }, 0);

    // Monitor scroll to trigger Scene Exit Transition at exactly 100% viewport scroll
    const sceneContainer = document.getElementById("parallax-scene");
    ScrollTrigger.create({
      trigger: "body",
      start: () => "+=" + window.innerHeight + " top",
      onEnter: () => {
        sceneContainer.classList.add("fade-out");
      },
      onLeaveBack: () => {
        sceneContainer.classList.remove("fade-out");
      }
    });
  </script>
</body>
</html>
